{% set gid = ga_id() %}
{% if gid %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ gid }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    'analytics_storage': 'denied',
    'ad_storage': 'denied'
  });
  gtag('js', new Date());
  gtag('config', '{{ gid }}');
  window.GA_ID = '{{ gid }}';
</script>
{% endif %}
