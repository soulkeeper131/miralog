<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Нова парола — МираСкоп</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-body: 'Inter', system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --bg: #0a0a1a; --bg-card: #1a1a2e; --bg-input: #16162a; --border: #2a2a4a;
            --text: #e0e0e0; --text-heading: #c9b1ff; --text-muted: #888;
            --accent: #7c3aed; --accent-hover: #6d28d9; --danger: #ef4444; --danger-bg: #2d1b1b; --danger-text: #fca5a5;
            --success-bg: #14261c; --success-text: #86efac;
        }
        :root[data-theme="light"] {
            --bg: #faf7fb; --bg-card: #fff; --bg-input: #f7f1f9; --border: #e5d4ec;
            --text: #2d2438; --text-heading: #6d4a89; --text-muted: #655a78;
            --accent: #8659a3; --accent-hover: #744a90; --danger: #c2255c; --danger-bg: #fce8ef; --danger-text: #a61e4d;
            --success-bg: #e6f6ed; --success-text: #1b7a45;
        }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
        h1 { font-family: var(--font-display); color: var(--text-heading); font-size: 1.8rem; margin-bottom: 8px; }
        p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.55; margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: var(--text-heading); font-size: 0.85rem; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 16px; margin-bottom: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; min-height: 44px; }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { display: none; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 0.9rem; }
        .msg.err { display: block; background: var(--danger-bg); color: var(--danger-text); }
        .msg.ok { display: block; background: var(--success-bg); color: var(--success-text); }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Нова парола</h1>
        <p>Избери нова парола за акаунта си (поне 6 символа).</p>
        <div id="msg" class="msg"></div>
        <form id="form">
            <label for="password">Нова парола</label>
            <input type="password" id="password" required minlength="6" autocomplete="new-password">
            <label for="confirm">Повтори паролата</label>
            <input type="password" id="confirm" required minlength="6" autocomplete="new-password">
            <button type="submit" id="btn">Запази паролата</button>
        </form>
    </div>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            msg.className = 'msg';
            if (!token) {
                msg.textContent = 'Липсва линк за нулиране. Заяви нов от страницата за забравена парола.';
                msg.className = 'msg err';
                return;
            }
            if (password !== confirm) {
                msg.textContent = 'Паролите не съвпадат.';
                msg.className = 'msg err';
                return;
            }
            btn.disabled = true;
            try {
                const resp = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || 'Грешка');
                msg.textContent = 'Паролата е сменена. Пренасочваме към вход…';
                msg.className = 'msg ok';
                setTimeout(() => location.replace('/login'), 1200);
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'msg err';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
