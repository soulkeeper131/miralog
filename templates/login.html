<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — МираСкоп</title>
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #666;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            --accent-lighter: #c9b1ff;
            --danger: #ef4444;
            --danger-bg: #2d1b1b;
            --danger-text: #fca5a5;
            --success: #22c55e;
        }
        :root[data-theme="light"] {
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #7a6d8a;
            --text-dim: #a595b0;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #8659a3;
            --accent-lighter: #6d4a89;
            --danger: #c2255c;
            --danger-bg: #fff0f5;
            --danger-text: #c2255c;
            --success: #16a34a;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-heading);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
            z-index: 200;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        .logo {
            text-align: center;
            margin-bottom: 8px;
            font-size: 2.5rem;
        }
        h1 {
            color: var(--text-heading);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: var(--accent-light);
            font-size: 0.9rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 16px;
            min-height: 44px;
            min-width: 44px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            min-width: 44px;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--danger-text);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.visible { display: block; }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--accent-light);
            text-decoration: none;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
        }
        .footer a:hover { text-decoration: underline; }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Смяна на тема"></button>
    <div class="container">
        <div class="logo">🔮</div>
        <h1>МираСкоп</h1>
        <p class="subtitle">Влезте в своя астрологичен профил</p>

        <div class="card">
            <div id="error" class="error-msg"></div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Имейл</label>
                    <input type="email" id="email" name="email" required
                           placeholder="вашият@имейл.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Парола</label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••" autocomplete="current-password" minlength="6">
                </div>
                <button type="submit" class="btn" id="submitBtn">Вход</button>
            </form>
        </div>

        <div class="footer">
            🔐 Един администраторски акаунт
        </div>
    </div>

    <script>
        function updateThemeToggleIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        // If already logged in, redirect to dashboard
        const existingToken = localStorage.getItem('miralog_token');
        if (existingToken) {
            window.location.replace('/dashboard');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Вход...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.detail || 'Грешка при вход');
                }

                // Store token and redirect
                localStorage.setItem('miralog_token', data.token);
                localStorage.setItem('miralog_email', data.user.email);
                window.location.replace('/dashboard');
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Вход';
            }
        });
    </script>
</body>
</html>
