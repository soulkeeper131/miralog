<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Добави човек — МираСкоп</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-body: 'Inter', -apple-system, system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --focus-ring: 0 0 0 3px rgba(124,58,237,0.28);
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #999;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            /* --- pastel palette (raw tones, identical in both themes) --- */
            --thistle: #cdb4db;
            --pastel-petal: #ffc8dd;
            --baby-pink: #ffafcc;
            --icy-blue: #bde0fe;
            --sky-blue: #a2d2ff;
            /* --- pastel accent surfaces (muted for dark backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.10);
            --surface-petal: rgba(255,200,221,0.10);
            --surface-pink: rgba(255,175,204,0.10);
            --surface-icy: rgba(189,224,254,0.10);
            --surface-sky: rgba(162,210,255,0.10);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #c9b1ff;
            --on-icy: #9ecbff;
            --on-pink: #ffafcc;
            --on-sky: #9fb3c8;
        }
        :root[data-theme="light"] {
            --focus-ring: 0 0 0 3px rgba(134,89,163,0.18);
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #7a6d8a;
            --text-dim: #a595b0;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #8659a3;
            /* --- pastel accent surfaces (stronger on light backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.28);
            --surface-petal: rgba(255,200,221,0.30);
            --surface-pink: rgba(255,175,204,0.28);
            --surface-icy: rgba(189,224,254,0.32);
            --surface-sky: rgba(162,210,255,0.28);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #5b3a73;
            --on-icy: #17496f;
            --on-pink: #a81b4d;
            --on-sky: #5c5468;
        }
        body { font-family: var(--font-body); font-size: 0.95rem; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: var(--bg); color: var(--text); min-height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); transition: background-color 0.2s, color 0.2s; }
        .theme-toggle {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
            z-index: 200;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        h1 {
            font-family: var(--font-display); font-weight: 700;
            letter-spacing: -0.02em; line-height: 1.2;
            color: var(--text-heading); font-size: 1.9rem; margin-bottom: 24px;
        }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; min-height: 44px; transition: color 0.15s ease; }
        .back-link:hover { color: var(--accent-light); }
        /* shared page mark: small logo sitting beside the back-link */
        .page-nav {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
        }
        .page-logo {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            box-shadow: 0 0 0 3px var(--surface-thistle);
        }
        form { background: var(--bg-card); border-radius: 12px; padding: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; color: var(--accent-light); font-size: 0.9rem; }
        input, select {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-input); color: var(--text); font-size: 16px; min-height: 44px; min-width: 44px;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .btn {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 8px; min-height: 44px; min-width: 44px;
        }
        .btn:hover { background: var(--accent-hover); }
        .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Смяна на тема"></button>
    <div class="container">
        <div class="page-nav">
            <img class="page-logo" src="/static/logo-header.png" alt="МираСкоп">
            <a href="/" class="back-link">← Назад</a>
        </div>
        <h1>Добави човек</h1>
        <form method="POST" action="/add">
            <div class="form-group">
                <label>Име</label>
                <input type="text" name="name" required placeholder="Име на човека">
            </div>

            <div class="row-3">
                <div class="form-group">
                    <label>Година</label>
                    <input type="number" name="year" required placeholder="1988" min="1800" max="2100">
                </div>
                <div class="form-group">
                    <label>Месец</label>
                    <input type="number" name="month" required placeholder="1" min="1" max="12">
                </div>
                <div class="form-group">
                    <label>Ден</label>
                    <input type="number" name="day" required placeholder="8" min="1" max="31">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Час</label>
                    <input type="number" name="hour" value="12" min="0" max="23">
                    <span class="hint">по Гринуич</span>
                </div>
                <div class="form-group">
                    <label>Минути</label>
                    <input type="number" name="minute" value="0" min="0" max="59">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Географска ширина</label>
                    <input type="number" name="lat" step="any" required placeholder="42.6977">
                </div>
                <div class="form-group">
                    <label>Географска дължина</label>
                    <input type="number" name="lon" step="any" required placeholder="23.3219">
                </div>
            </div>

            <div class="form-group">
                <label>Часова зона</label>
                <input type="text" name="timezone" value="Europe/Sofia" placeholder="Europe/Sofia">
            </div>

            <button type="submit" class="btn">Създай натална карта</button>
        </form>
    </div>
    <script>
        function updateThemeToggleIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();
    </script>
</body>
</html>
