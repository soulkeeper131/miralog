<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Настройки — МираСкоп</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-body: 'Inter', -apple-system, system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --shadow-card: 0 0 0 1px rgba(124,58,237,0.06), 0 8px 28px rgba(0,0,0,0.45);
            --focus-ring: 0 0 0 3px rgba(124,58,237,0.28);
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #999;
            --text-off: #666;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            --danger: #ef4444;
            --danger-bg: #2d1b1b;
            --danger-text: #fca5a5;
            --success: #22c55e;
            --success-bg: #14261c;
            --success-text: #86efac;
            /* --- pastel palette (raw tones, identical in both themes) --- */
            --thistle: #cdb4db;
            --pastel-petal: #ffc8dd;
            --baby-pink: #ffafcc;
            --icy-blue: #bde0fe;
            --sky-blue: #a2d2ff;
            /* --- pastel accent surfaces (muted for dark backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.10);
            --surface-petal: rgba(255,200,221,0.10);
            --surface-pink: rgba(255,175,204,0.10);
            --surface-icy: rgba(189,224,254,0.10);
            --surface-sky: rgba(162,210,255,0.10);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #c9b1ff;
            --on-icy: #9ecbff;
            --on-pink: #ffafcc;
            --on-sky: #9fb3c8;
        }
        :root[data-theme="light"] {
            --shadow-card: 0 1px 2px rgba(45,36,56,0.04), 0 8px 24px rgba(134,89,163,0.10);
            --focus-ring: 0 0 0 3px rgba(134,89,163,0.18);
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #7a6d8a;
            --text-dim: #a595b0;
            --text-off: #c9b8d4;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #8659a3;
            --danger: #c2255c;
            --danger-bg: #fff0f5;
            --danger-text: #c2255c;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            /* --- pastel accent surfaces (stronger on light backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.28);
            --surface-petal: rgba(255,200,221,0.30);
            --surface-pink: rgba(255,175,204,0.28);
            --surface-icy: rgba(189,224,254,0.32);
            --surface-sky: rgba(162,210,255,0.28);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #5b3a73;
            --on-icy: #17496f;
            --on-pink: #a81b4d;
            --on-sky: #5c5468;
        }
        body {
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
            z-index: 200;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 0.85rem;
            display: inline-flex; align-items: center;
            min-height: 44px;
            transition: color 0.15s ease;
        }
        .back-link:hover { color: var(--accent-light); }
        /* shared page mark: small logo sitting beside the back-link */
        .page-nav {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
        }
        .page-logo {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            box-shadow: 0 0 0 3px var(--surface-thistle);
        }
        h1 {
            font-family: var(--font-display); font-weight: 700;
            letter-spacing: -0.02em; line-height: 1.2;
            color: var(--text-heading); font-size: 1.9rem; margin-bottom: 4px;
        }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

        .crystal-loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem;
        }
        .crystal-loader .orb-wrap {
            position: relative; width: 56px; height: 56px;
        }
        .crystal-loader .orb {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--accent-light) 35%, var(--accent) 75%, var(--text-heading) 100%);
            box-shadow: 0 0 18px 2px color-mix(in srgb, var(--accent) 55%, transparent);
            animation: orb-pulse 1.8s ease-in-out infinite;
        }
        .crystal-loader .spark {
            position: absolute; inset: 0;
            animation: orb-spin 2.4s linear infinite;
        }
        .crystal-loader .spark::before {
            content: "✦"; position: absolute; top: -6px; left: 50%;
            transform: translateX(-50%); font-size: 0.85rem; color: var(--accent-light);
        }
        @keyframes orb-pulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes orb-spin {
            to { transform: rotate(360deg); }
        }

        .section {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; margin-bottom: 20px;
        }
        /* alternating pastel tint so stacked settings sections read apart */
        .section:nth-of-type(odd) { background: var(--surface-thistle); }
        .section:nth-of-type(even) { background: var(--surface-icy); }
        .section h2 {
            color: var(--accent-light); font-size: 1.15rem; font-weight: 600;
            letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 6px;
        }
        .section .desc {
            color: var(--text-muted); font-size: 0.85rem; margin-bottom: 18px;
            line-height: 1.65; max-width: 68ch;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; color: var(--accent-light); font-size: 0.85rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-input); color: var(--text);
            font-size: 16px; min-height: 44px; min-width: 44px;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

        .status-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-off); flex-shrink: 0; }
        .status-dot.on { background: var(--success); }
        .status-dot.off { background: var(--danger); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 18px; border-radius: 10px; border: none;
            font-size: 0.95rem; font-weight: 500; cursor: pointer;
            min-height: 44px; min-width: 44px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-banner, .success-banner {
            border-radius: 8px; padding: 12px 16px; font-size: 0.9rem; margin-bottom: 16px;
        }
        .error-banner { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger-text); }
        .success-banner { background: var(--success-bg); border: 1px solid var(--success); color: var(--success-text); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Смяна на тема"></button>
    <div class="container">
        <div class="page-nav">
            <img class="page-logo" src="/static/logo-header.png" alt="МираСкоп">
            <a href="#" id="backLink" class="back-link">← Табло</a>
        </div>
        <h1>Настройки</h1>
        <div class="subtitle">Конфигурация на приложението</div>

        <div id="banner"></div>

        <div class="section">
            <h2>AI Интерпретация</h2>
            <div class="desc">
                API ключ за генериране на AI интерпретация на натални карти.
                Ключът се пази в базата данни на приложението.
            </div>

            <div id="settingsLoader" class="crystal-loader">
                <div class="orb-wrap"><div class="orb"></div><div class="spark"></div></div>
                Зареждане на настройките...
            </div>

            <div id="settingsBody" hidden>
            <div class="status-row">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText"></span>
            </div>

            <form id="settingsForm">
                <div class="form-group">
                    <label>Доставчик</label>
                    <select id="aiProvider">
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API ключ</label>
                    <input type="password" id="aiApiKey" placeholder="Оставете празно, за да не променяте текущия ключ" autocomplete="off">
                    <div class="hint" id="keyHint"></div>
                </div>
                <button type="submit" class="btn btn-primary" id="saveBtn">Запази</button>
            </form>
            </div>
        </div>
    </div>

    <script>
        function updateThemeToggleIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token') || localStorage.getItem('miralog_token');
        }
        function authHeaders() {
            const token = getToken();
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }
        if (!getToken()) {
            window.location.replace('/login');
        }
        document.getElementById('backLink').href = '/dashboard?token=' + encodeURIComponent(getToken());

        function showBanner(msg, kind) {
            const el = document.getElementById('banner');
            el.innerHTML = `<div class="${kind === 'error' ? 'error-banner' : 'success-banner'}">${msg}</div>`;
            setTimeout(() => { el.innerHTML = ''; }, 4000);
        }

        function revealSettings() {
            document.getElementById('settingsLoader').hidden = true;
            document.getElementById('settingsBody').hidden = false;
        }

        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings', { headers: authHeaders() });
                if (resp.status === 401) { window.location.replace('/login'); return; }
                const data = await resp.json();
                document.getElementById('aiProvider').value = data.ai_provider || 'deepseek';
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const hint = document.getElementById('keyHint');
                dot.classList.remove('on', 'off');
                if (data.ai_api_key_set) {
                    dot.classList.add('on');
                    text.textContent = 'AI ключ е конфигуриран (' + data.ai_api_key_masked + ')';
                    hint.textContent = 'Текущ ключ е зададен. Въведете нов, за да го смените.';
                } else {
                    dot.classList.add('off');
                    text.textContent = 'Няма конфигуриран AI ключ';
                    hint.textContent = '';
                }
                revealSettings();
            } catch (e) {
                revealSettings();
                showBanner('Грешка при зареждане на настройките: ' + e.message, 'error');
            }
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Запазване...';
            try {
                const key = document.getElementById('aiApiKey').value.trim();
                const provider = document.getElementById('aiProvider').value;
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ai_api_key: key || null, ai_provider: provider })
                });
                if (resp.status === 401) { window.location.replace('/login'); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || 'Грешка при запазване');
                }
                document.getElementById('aiApiKey').value = '';
                showBanner('Настройките са запазени успешно.', 'success');
                loadSettings();
            } catch (err) {
                showBanner(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Запази';
            }
        });

        loadSettings();
    </script>
</body>
</html>
