<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Любов и съвместимост — {{ brand().name }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0a0a1a; --text: #e0e0e0; --muted: #9090a4; --accent: #7c3aed; --accent-light: #a78bfa; }
        :root[data-theme="light"] { --bg: #faf7fb; --text: #2d2438; --muted: #655a78; --accent: #8659a3; --accent-light: #764a93; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif; line-height: 1.6;
            background: var(--bg); color: var(--text); min-height: 100dvh;
            display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        }
        .box { max-width: 420px; text-align: center; }
        h1 { font-size: 1.4rem; margin-bottom: 8px; }
        p { color: var(--muted); margin-bottom: 18px; }
        a.btn {
            display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
            padding: 10px 20px; border-radius: 10px; background: var(--accent); color: #fff;
            text-decoration: none; font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Съвместимостта вече е в таба „Любов“ на картата. Адресът остава, за да
         не се чупят стари връзки: сървърът пренасочва вписаните с бисквитка,
         а тук същото се прави с токена от браузъра. -->
    <div class="box">
        <h1>Любов и съвместимост</h1>
        <p id="msg">Отваряме таба „Любов“ на картата ти…</p>
        <a class="btn" id="go" href="/dashboard">Към моите карти</a>
    </div>
    <script>
        (async function () {
            var token = null;
            try { token = localStorage.getItem('miralog_token'); } catch (e) {}
            if (!token) { location.replace('/login'); return; }
            try {
                var resp = await fetch('/api/persons', { headers: { 'Authorization': 'Bearer ' + token } });
                if (resp.status === 401) { location.replace('/login'); return; }
                var data = await resp.json();
                var persons = data.persons || [];
                if (!persons.length) {
                    document.getElementById('msg').textContent =
                        'Първо добави карта — любовното разчитане се отваря от нея.';
                    return;
                }
                // Последно отворената карта, иначе най-старата.
                var last = 0;
                try { last = Number(localStorage.getItem('miralog_last_person')) || 0; } catch (e) {}
                var target = persons.find(function (p) { return p.id === last; }) ||
                    persons.reduce(function (a, p) { return p.id < a.id ? p : a; }, persons[0]);
                location.replace('/chart/' + target.id + '#love');
            } catch (e) {
                document.getElementById('msg').textContent = 'Не успяхме да отворим картата. Опитай от таблото.';
            }
        })();
    </script>
</body>
</html>
