<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% if share %}{{ share.title }} — за {{ share.name }}{% else %}Споделено разчитане{% endif %} — {{ brand().name }}</title>
    <meta name="robots" content="noindex">
    {% if share %}
    {# Прегледът на линка във Facebook, Viber, WhatsApp, Messenger, Telegram,
       X и LinkedIn — те не изпълняват JavaScript, затова мета е от сървъра. #}
    <meta name="description" content="{{ share.description }}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ brand().name }}">
    <meta property="og:locale" content="bg_BG">
    <meta property="og:title" content="{{ share.title }} — за {{ share.name }}">
    <meta property="og:description" content="{{ share.description }}">
    <meta property="og:url" content="{{ share_url }}">
    <meta property="og:image" content="{{ share_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="{{ share.title }} — {{ brand().name }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ share.title }} — за {{ share.name }}">
    <meta name="twitter:description" content="{{ share.description }}">
    <meta name="twitter:image" content="{{ share_image }}">
    {% endif %}
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-body: 'Inter', system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --bg: #0a0a1a; --bg-card: #1a1a2e; --border: #2a2a4a;
            --text: #e0e0e0; --text-heading: #c9b1ff; --text-muted: #888; --accent: #7c3aed;
        }
        :root[data-theme="light"] {
            --bg: #faf7fb; --bg-card: #fff; --border: #e5d4ec;
            --text: #2d2438; --text-heading: #6d4a89; --text-muted: #655a78; --accent: #8659a3;
        }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 16px 64px; }
        .wrap { max-width: 720px; margin: 0 auto; }
        .brand { font-family: var(--font-display); color: var(--text-heading); font-size: 1.4rem; margin-bottom: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
        h1 { font-family: var(--font-display); color: var(--text-heading); font-size: 2rem; margin-bottom: 6px; }
        .meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px; }
        .content { line-height: 1.75; white-space: pre-wrap; font-size: 1rem; }
        .content-html { white-space: normal; }
        .content-html h3 { font-size: 1.1rem; margin: 1.4em 0 .4em; }
        .content-html ul { padding-left: 1.3em; }
        .cta { margin-top: 28px; }
        .cta a { color: #fff; background: var(--accent); text-decoration: none; padding: 12px 18px; border-radius: 10px; display: inline-block; }
        .err { color: var(--text-muted); padding: 40px 0; }
    </style>
{% include "_analytics.html" %}
<link rel="stylesheet" href="/static/consent.css">
</head>
<body>
    <div class="wrap">
        <div class="brand">{{ brand().name }}</div>
        <div id="root" class="card"><p class="err">Зареждане…</p></div>
    </div>
    <script>
        (async function() {
            const root = document.getElementById('root');
            try {
                const resp = await fetch('/api/share/{{ token }}');
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || 'Линкът не е валиден');
                document.title = (data.title || 'Разчитане') + ' — {{ brand().name }}';
                root.innerHTML =
                    '<h1>' + escapeHtml(data.title || 'Разчитане') + '</h1>' +
                    '<div class="meta">за ' + escapeHtml(data.person_name || '') +
                    (data.generated_at ? ' · ' + escapeHtml(String(data.generated_at).slice(0, 10)) : '') +
                    '</div>' +
                    (data.content_html
                        ? '<div class="content content-html">' + data.content_html + '</div>'
                        : '<div class="content">' + escapeHtml(data.content || '') + '</div>') +
                    '<div class="cta">{% set _c = primary_cta(None, 'Създай своята карта') %}<a href="{{ _c.href }}" data-cta="share:start">{{ _c.label }}</a></div>';
            } catch (e) {
                root.innerHTML = '<p class="err">' + escapeHtml(e.message) + '</p>';
            }
        })();
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }
    </script>
<script src="/static/consent.js?v=6"></script>
</body>
</html>
