<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Табло — {{ brand().name }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* The mark takes you home — the convention every visitor knows. */
        .logo-home {
            display: inline-flex; flex-shrink: 0; line-height: 0;
            border-radius: 50%; text-decoration: none;
            transition: transform .15s ease, opacity .15s ease;
        }
        .logo-home:hover { transform: scale(1.05); opacity: .9; }
        .logo-home:focus-visible {
            outline: none; box-shadow: var(--focus-ring, 0 0 0 3px rgba(124,58,237,.28));
        }

        /* Any display value beats the hidden attribute, so state it explicitly —
           otherwise a hidden button with display:inline-flex stays on screen. */
        [hidden] { display: none !important; }
        :root {
            --font-body: 'Inter', -apple-system, system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --shadow-card: 0 0 0 1px rgba(124,58,237,0.06), 0 8px 28px rgba(0,0,0,0.45);
            --shadow-raised: 0 6px 20px rgba(124,58,237,0.32);
            --focus-ring: 0 0 0 3px rgba(124,58,237,0.28);
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --border-dashed: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #9090a4;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            --danger: #ef4444;
            --danger-bg: #2d1b1b;
            --danger-text: #fca5a5;
            --danger-tint: #ef444420;
            --success: #22c55e;
            --overlay: rgba(0,0,0,0.7);
            --cancel-border: #555;
            --cancel-text: #888;
            --cancel-tint: #55555520;
            /* --- pastel palette (raw tones, identical in both themes) --- */
            --thistle: #cdb4db;
            --pastel-petal: #ffc8dd;
            --baby-pink: #ffafcc;
            --icy-blue: #bde0fe;
            --sky-blue: #a2d2ff;
            /* --- pastel accent surfaces (muted for dark backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.10);
            --surface-petal: rgba(255,200,221,0.10);
            --surface-pink: rgba(255,175,204,0.10);
            --surface-icy: rgba(189,224,254,0.10);
            --surface-sky: rgba(162,210,255,0.10);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #c9b1ff;
            --on-icy: #9ecbff;
            --on-pink: #ffafcc;
            --on-sky: #9fb3c8;
        }
        :root[data-theme="light"] {
            --shadow-card: 0 1px 2px rgba(45,36,56,0.04), 0 8px 24px rgba(134,89,163,0.10);
            --shadow-raised: 0 6px 18px rgba(134,89,163,0.28);
            --focus-ring: 0 0 0 3px rgba(134,89,163,0.18);
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --border-dashed: #d9c2e6;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #655a78;
            --text-dim: #6b5876;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #764a93;
            --danger: #c2255c;
            --danger-bg: #fff0f5;
            --danger-text: #c2255c;
            --danger-tint: #c2255c1a;
            --success: #16a34a;
            --overlay: rgba(45,36,56,0.5);
            --cancel-border: #d9c7e2;
            --cancel-text: #655a78;
            --cancel-tint: #e5d4ec55;
            /* --- pastel accent surfaces (stronger on light backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.28);
            --surface-petal: rgba(255,200,221,0.30);
            --surface-pink: rgba(255,175,204,0.28);
            --surface-icy: rgba(189,224,254,0.32);
            --surface-sky: rgba(162,210,255,0.28);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #5b3a73;
            --on-icy: #17496f;
            --on-pink: #a81b4d;
            --on-sky: #5c5468;
        }
        body {
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .theme-toggle:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-card); }
        .theme-toggle:active { transform: translateY(0); }
        .theme-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            box-shadow: 0 0 0 4px var(--surface-thistle), var(--shadow-card);
        }
        .topbar h1 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: var(--text-heading);
            font-size: 1.9rem;
        }
        .topbar .greeting {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-top: 1px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* thin rule separating navigation links from the destructive action */
        .topbar-right .nav-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            min-height: 44px;
            min-width: 44px;
            white-space: nowrap;
        }
        .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        /* emoji sits on its own line-box so it optically centres with the label */
        .btn .btn-ico {
            font-size: 1rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger-tint); }
        .btn-large { padding: 14px 28px; font-size: 1.05rem; min-height: 48px; min-width: 48px; }
        .btn-icon { padding: 10px; min-width: 44px; min-height: 44px; }

        /* Section headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 8px;
        }
        .section-header h2 {
            color: var(--accent-light);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        /* Person cards */
        .person-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
            gap: 12px;
        }
        .person-card:hover { border-color: var(--accent-light); background: var(--surface-thistle); }
        .person-info { flex: 1; min-width: 0; }
        .person-info h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
            margin-bottom: 3px;
        }
        .person-info .meta {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.5;
        }
        .person-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Empty state */
        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 50px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-dashed);
            border-radius: 12px;
        }
        .empty p { margin-bottom: 6px; }

        /* Add bar */
        .add-bar {
            text-align: center;
            margin: 28px 0;
        }

        /* Loading / error */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .crystal-loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem;
        }
        .crystal-loader .orb-wrap {
            position: relative; width: 56px; height: 56px;
        }
        .crystal-loader .orb {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--accent-light) 35%, var(--accent) 75%, var(--text-heading) 100%);
            box-shadow: 0 0 18px 2px color-mix(in srgb, var(--accent) 55%, transparent);
            animation: orb-pulse 1.8s ease-in-out infinite;
        }
        .crystal-loader .spark {
            position: absolute; inset: 0;
            animation: orb-spin 2.4s linear infinite;
        }
        .crystal-loader .spark::before {
            content: "✦"; position: absolute; top: -6px; left: 50%;
            transform: translateX(-50%); font-size: 0.85rem; color: var(--accent-light);
        }
        @keyframes orb-pulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes orb-spin {
            to { transform: rotate(360deg); }
        }
        .error-banner {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--danger-text);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* Modal overlay for add person */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--text-heading);
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--accent-light);
            font-size: 0.85rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 16px;
            min-height: 44px;
            min-width: 44px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .place-group { position: relative; }
        .place-results {
            display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
            margin-top: 4px; max-height: 240px; overflow-y: auto;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; box-shadow: var(--shadow-card);
        }
        .place-results.open { display: block; }
        .place-item {
            padding: 10px 14px; cursor: pointer; font-size: 0.85rem; line-height: 1.45;
            border-bottom: 1px solid var(--border-soft);
            transition: background-color 0.12s ease;
        }
        .place-item:last-child { border-bottom: none; }
        .place-item:hover, .place-item.active { background: var(--surface-thistle); }
        .place-item .pl-name { color: var(--text-heading); font-weight: 600; }
        .place-item .pl-detail { color: var(--text-muted); font-size: 0.78rem; }
        .place-status { padding: 12px 14px; font-size: 0.82rem; color: var(--text-muted); text-align: center; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-cancel { background: transparent; border: 1px solid var(--cancel-border); color: var(--cancel-text); }
        .btn-cancel:hover { background: var(--cancel-tint); color: var(--text); }

        @media (max-width: 600px) {
            .container { padding: 12px; }
            .person-card { flex-direction: column; align-items: flex-start; }
            .person-actions { width: 100%; justify-content: flex-end; }
            .topbar { gap: 12px; margin-bottom: 20px; padding-bottom: 16px; }
            .topbar h1 { font-size: 1.5rem; }
            .brand-logo { width: 40px; height: 40px; }
            /* The actions move to the bottom bar on a phone, so the header
               goes back to being a header: logo, name, greeting. */
            .topbar-right { display: none; }
            .modal { padding: 20px; border-radius: 12px; }

            /* Room for the fixed bar, plus the home-indicator inset. */
            body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
        }

        /* --- bottom navigation (phones only) ---
           Fixed within thumb reach, the way a native app puts its tabs. It is
           hidden by default and only switched on inside the media query above,
           so the desktop layout is untouched. */
        .bottom-nav {
            display: none;
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
            justify-content: space-around; align-items: stretch;
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 16px rgba(0, 0, 0, .18);
        }
        .bottom-nav a, .bottom-nav button {
            flex: 1 1 0; min-width: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px;
            min-height: 56px; padding: 8px 4px;
            border: none; background: none; cursor: pointer;
            font-family: var(--font-body); font-size: .66rem; font-weight: 500;
            /* --text, not --text-muted: at this size the muted tone sat just
               above the AA floor in dark mode. */
            color: var(--text); text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .bn-ico { font-size: 1.2rem; line-height: 1; }
        .bottom-nav a:active, .bottom-nav button:active { background: var(--surface-thistle); }
        .bottom-nav a:focus-visible, .bottom-nav button:focus-visible {
            outline: none; box-shadow: inset 0 0 0 2px var(--accent);
        }
        /* The current page is not a destination — mark it, do not offer it. */
        .bottom-nav .bn-current { color: var(--accent-light); }
        .bottom-nav .bn-danger { color: var(--danger, #ef4444); }
        .bottom-nav [hidden] { display: none !important; }
        /* Switched on last, so it wins over the `display: none` above rather
           than losing to it on source order. */
        @media (max-width: 600px) {
            .bottom-nav { display: flex; }
        }
    </style>
    <link rel="stylesheet" href="/static/consent.css">
{% include "_analytics.html" %}
</head>
<body>
    <div class="container">
        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-left">
                <a class="logo-home" href="/" title="Към началната страница" aria-label="Към началната страница"><img class="brand-logo" src="{{ brand().logo }}" alt="{{ brand().name }}"></a>
                <div>
                    <h1>{{ brand().name }}</h1>
                    <div class="greeting">Здравей, <span id="userEmail">...</span>!</div>
                </div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-cancel" id="moonLink" href="#"><span class="btn-ico" aria-hidden="true">🌙</span>Лунен календар</a>
                <!-- Съвместимостта живее в „Любовен хороскоп“ на самата карта,
                     където има кого да сравняваш. -->
                <a class="btn btn-cancel" id="adminLink" href="#" hidden><span class="btn-ico" aria-hidden="true">⚒</span>Админ</a>
                <a class="btn btn-cancel" id="settingsLink" href="#"><span class="btn-ico" aria-hidden="true">⚙</span>Настройки</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <button class="btn btn-danger" onclick="logout()">Изход</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Смяна на тема"></button>
            </div>
        </div>

        <!-- Error banner -->
        <div id="errorBanner" class="error-banner" style="display:none;"></div>

        <!-- Persons list -->
        <div class="section-header">
            <h2>Твоите хора</h2>
        </div>

        <div id="personsList">
            <div class="crystal-loader"><div class="orb-wrap"><div class="orb"></div><div class="spark"></div></div>Зареждане на хората...</div>
        </div>

        <!-- Add button -->
        <div class="add-bar">
            <button class="btn btn-primary btn-large" onclick="openAddModal()">＋ Добави човек</button>
        </div>
    </div>

    <!-- Phone navigation. The same destinations as the header, within reach of
         a thumb. Hidden on desktop, where the header already carries them. -->
    <nav class="bottom-nav" aria-label="Основно меню">
        <a href="/dashboard" class="bn-current" aria-current="page">
            <span class="bn-ico" aria-hidden="true">✦</span>Табло</a>
        <a href="#" id="moonLinkMobile">
            <span class="bn-ico" aria-hidden="true">☾</span>Луна</a>
        <a href="#" id="settingsLinkMobile">
            <span class="bn-ico" aria-hidden="true">⚙</span>Настройки</a>
        <a href="#" id="adminLinkMobile" hidden>
            <span class="bn-ico" aria-hidden="true">⚒</span>Админ</a>
        <button type="button" onclick="toggleTheme()" id="themeToggleMobile"
                aria-label="Смяна на тема">
            <span class="bn-ico" aria-hidden="true">☀</span>Тема</button>
        <button type="button" onclick="logout()" class="bn-danger">
            <span class="bn-ico" aria-hidden="true">↪</span>Изход</button>
    </nav>

    <!-- Add Person Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Добави човек</h2>
            <div id="modalError" class="error-banner" style="display:none;"></div>
            <form id="addPersonForm">
                <div class="form-group">
                    <label for="addName">Име</label>
                    <input type="text" id="addName" required placeholder="Име на човека">
                </div>
                <div class="row-3">
                    <div class="form-group">
                        <label for="addYear">Година</label>
                        <input type="number" id="addYear" required placeholder="1988" min="1800" max="2100">
                    </div>
                    <div class="form-group">
                        <label for="addMonth">Месец</label>
                        <input type="number" id="addMonth" required placeholder="1" min="1" max="12">
                    </div>
                    <div class="form-group">
                        <label for="addDay">Ден</label>
                        <input type="number" id="addDay" required placeholder="8" min="1" max="31">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Час <span class="hint">(по Гринуич)</span></label>
                        <input type="number" id="addHour" value="12" min="0" max="23">
                    </div>
                    <div class="form-group">
                        <label for="addMinute">Минути</label>
                        <input type="number" id="addMinute" value="0" min="0" max="59">
                    </div>
                </div>
                <div class="form-group place-group">
                    <label for="addPlace">Място на раждане</label>
                    <input type="text" id="addPlace" placeholder="Напр. София, Пловдив, Видин..." autocomplete="off">
                    <div id="placeResults" class="place-results"></div>
                    <div class="hint">Потърси населено място — координатите и часовата зона се попълват автоматично.</div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="addLat">Геогр. ширина</label>
                        <input type="number" id="addLat" step="any" required placeholder="42.6977">
                    </div>
                    <div class="form-group">
                        <label for="addLon">Геогр. дължина</label>
                        <input type="number" id="addLon" step="any" required placeholder="23.3219">
                    </div>
                </div>
                <div class="form-group">
                    <label for="addTimezone">Часова зона</label>
                    <input type="text" id="addTimezone" value="Europe/Sofia" placeholder="Europe/Sofia">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeAddModal()">Отказ</button>
                    <button type="submit" class="btn btn-primary" id="addSubmitBtn">Добави</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/ui.js"></script>
    <script>
        function crystalLoader(text) {
            return '<div class="crystal-loader"><div class="orb-wrap"><div class="orb"></div><div class="spark"></div></div>' + text + '</div>';
        }

        function updateThemeToggleIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
            // The bottom bar keeps its label, so only its glyph changes.
            // Monochrome here: a colour emoji among the outline icons stands
            // out as a mistake rather than a highlight.
            const mobileIco = document.querySelector('#themeToggleMobile .bn-ico');
            if (mobileIco) mobileIco.textContent = isLight ? '☾' : '☀';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();

        // --- Auth helpers ---
        function getToken() {
            return localStorage.getItem('miralog_token');
        }

        function authHeaders() {
            const token = getToken();
            if (!token) return {};
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            localStorage.removeItem('miralog_token');
            localStorage.removeItem('miralog_email');
            document.cookie = 'miralog_token=; path=/; Max-Age=0';
            window.location.replace('/login');
        }

        // Redirect if no token
        if (!getToken()) {
            window.location.replace('/login');
        }

        // Show email
        const email = localStorage.getItem('miralog_email') || '...';
        document.getElementById('userEmail').textContent = email;
        document.getElementById('settingsLink').href = '/settings';
        // synastryLink е премахнат от навигацията.
        document.getElementById('moonLink').href = '/moon';
        // The bottom bar leads to the same places as the header.
        document.getElementById('settingsLinkMobile').href = '/settings';
        document.getElementById('moonLinkMobile').href = '/moon';

        // The admin link only appears for accounts that actually hold the role.
        (async function revealAdminLink() {
            try {
                const resp = await fetch('/api/auth/me', { headers: authHeaders() });
                if (!resp.ok) return;
                const me = await resp.json();
                if (me.is_admin) {
                    ['adminLink', 'adminLinkMobile'].forEach(function (id) {
                        const link = document.getElementById(id);
                        if (!link) return;
                        link.href = '/admin';
                        link.hidden = false;
                    });
                }
            } catch (e) { /* the panel stays hidden; nothing else depends on this */ }
        })();

        // --- API helpers ---
        function showError(msg) {
            const el = document.getElementById('errorBanner');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function apiGet(url) {
            const resp = await fetch(url, { headers: authHeaders() });
            if (resp.status === 401) {
                logout();
                return null;
            }
            if (!resp.ok) {
                const data = await resp.json().catch(() => ({}));
                throw new Error(data.detail || 'API грешка');
            }
            return resp.json();
        }

        async function fetchPersons() {
            const listEl = document.getElementById('personsList');
            listEl.innerHTML = crystalLoader('Зареждане на хората...');
            try {
                const data = await apiGet('/api/persons');
                if (!data) return;

                const persons = data.persons || [];
                if (persons.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty">
                            <p>Все още няма добавени хора.</p>
                            <p>Добавете първия човек, за да видите наталната му карта.</p>
                        </div>`;
                    return;
                }

                let html = '';
                persons.forEach(p => {
                    const hour = String(p.hour).padStart(2, '0');
                    const minute = String(p.minute).padStart(2, '0');
                    html += `
                        <div class="person-card">
                            <div class="person-info">
                                <h3>${escapeHtml(p.name)}</h3>
                                <div class="meta">
                                    ${p.day}.${p.month}.${p.year}, ${hour}:${minute} ч.
                                    • ${p.lat}, ${p.lon}
                                </div>
                            </div>
                            <div class="person-actions">
                                <a href="/chart/${p.id}" class="btn btn-primary">Карта</a>
                                <button class="btn btn-danger btn-icon" onclick="deletePerson(${p.id})" title="Изтрий">✕</button>
                            </div>
                        </div>`;
                });
                listEl.innerHTML = html;
            } catch (err) {
                listEl.innerHTML = `<div class="error-banner">Грешка при зареждане: ${escapeHtml(err.message)}</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deletePerson(id) {
            const ok = await uiConfirm('Картата и всички разчитания към нея се изтриват безвъзвратно.', {
                title: 'Да изтрия ли този човек?', ok: 'Изтрий', danger: true });
            if (!ok) return;
            try {
                const resp = await fetch('/api/persons/' + id, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || 'Грешка при изтриване');
                }
                fetchPersons();
            } catch (err) {
                showError(err.message);
            }
        }

        // --- Place search (geocoding) ---
        let placeTimer = null;

        function closePlaceResults() {
            const box = document.getElementById('placeResults');
            box.classList.remove('open');
            box.innerHTML = '';
        }

        function pickPlace(lat, lon, tz, label) {
            document.getElementById('addLat').value = lat;
            document.getElementById('addLon').value = lon;
            if (tz) document.getElementById('addTimezone').value = tz;
            document.getElementById('addPlace').value = label;
            closePlaceResults();
        }

        async function searchPlace(query) {
            const box = document.getElementById('placeResults');
            box.innerHTML = '<div class="place-status">Търсене...</div>';
            box.classList.add('open');
            try {
                const resp = await fetch('/api/geocode?q=' + encodeURIComponent(query), { headers: authHeaders() });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                const results = data.results || [];
                if (!results.length) {
                    box.innerHTML = '<div class="place-status">Няма намерени места.</div>';
                    return;
                }
                box.innerHTML = results.map(r => {
                    const name = escapeHtml(r.place || r.label);
                    const detail = escapeHtml(r.label);
                    const tz = escapeHtml(r.timezone || '');
                    return `<div class="place-item" onclick="pickPlace(${r.lat}, ${r.lon}, '${tz}', '${name.replace(/'/g, "\\'")}')">
                        <div class="pl-name">${name}</div>
                        <div class="pl-detail">${detail}</div>
                    </div>`;
                }).join('');
            } catch (e) {
                box.innerHTML = '<div class="place-status">Грешка при търсене: ' + escapeHtml(e.message) + '</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('addPlace');
            if (!input) return;
            input.addEventListener('input', () => {
                const q = input.value.trim();
                clearTimeout(placeTimer);
                if (q.length < 2) { closePlaceResults(); return; }
                // Debounced so we stay within Nominatim's one-request-per-second policy.
                placeTimer = setTimeout(() => searchPlace(q), 600);
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.place-group')) closePlaceResults();
            });
        });

        // --- Add person modal ---
        function openAddModal() {
            document.getElementById('addModal').classList.add('open');
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('addPersonForm').reset();
            document.getElementById('addTimezone').value = 'Europe/Sofia';
            document.getElementById('addHour').value = '12';
            document.getElementById('addMinute').value = '0';
            closePlaceResults();
            document.getElementById('addName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
        }

        document.getElementById('addPersonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modalError = document.getElementById('modalError');
            const submitBtn = document.getElementById('addSubmitBtn');
            modalError.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Добавяне...';

            const formData = new FormData();
            formData.append('name', document.getElementById('addName').value.trim());
            formData.append('year', document.getElementById('addYear').value);
            formData.append('month', document.getElementById('addMonth').value);
            formData.append('day', document.getElementById('addDay').value);
            formData.append('hour', document.getElementById('addHour').value);
            formData.append('minute', document.getElementById('addMinute').value);
            formData.append('lat', document.getElementById('addLat').value);
            formData.append('lon', document.getElementById('addLon').value);
            formData.append('timezone', document.getElementById('addTimezone').value.trim() || 'Europe/Sofia');

            try {
                const resp = await fetch('/api/persons', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || 'Грешка при добавяне');
                }
                closeAddModal();
                fetchPersons();
            } catch (err) {
                modalError.textContent = err.message;
                modalError.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Добави';
            }
        });

        // Close modal on overlay click
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAddModal();
        });

        // --- Init ---
        fetchPersons();
    </script>
    <script src="/static/consent.js"></script>
</body>
</html>
