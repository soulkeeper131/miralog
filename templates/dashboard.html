<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Табло — МираСкоп</title>
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --border-dashed: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #666;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            --danger: #ef4444;
            --danger-bg: #2d1b1b;
            --danger-text: #fca5a5;
            --danger-tint: #ef444420;
            --success: #22c55e;
            --overlay: rgba(0,0,0,0.7);
            --cancel-border: #555;
            --cancel-text: #888;
            --cancel-tint: #55555520;
            /* --- pastel palette (raw tones, identical in both themes) --- */
            --thistle: #cdb4db;
            --pastel-petal: #ffc8dd;
            --baby-pink: #ffafcc;
            --icy-blue: #bde0fe;
            --sky-blue: #a2d2ff;
            /* --- pastel accent surfaces (muted for dark backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.10);
            --surface-petal: rgba(255,200,221,0.10);
            --surface-pink: rgba(255,175,204,0.10);
            --surface-icy: rgba(189,224,254,0.10);
            --surface-sky: rgba(162,210,255,0.10);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #c9b1ff;
            --on-icy: #9ecbff;
            --on-pink: #ffafcc;
            --on-sky: #9fb3c8;
        }
        :root[data-theme="light"] {
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --border-dashed: #d9c2e6;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #7a6d8a;
            --text-dim: #a595b0;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #8659a3;
            --danger: #c2255c;
            --danger-bg: #fff0f5;
            --danger-text: #c2255c;
            --danger-tint: #c2255c1a;
            --success: #16a34a;
            --overlay: rgba(45,36,56,0.5);
            --cancel-border: #d9c7e2;
            --cancel-text: #7a6d8a;
            --cancel-tint: #e5d4ec55;
            /* --- pastel accent surfaces (stronger on light backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.28);
            --surface-petal: rgba(255,200,221,0.30);
            --surface-pink: rgba(255,175,204,0.28);
            --surface-icy: rgba(189,224,254,0.32);
            --surface-sky: rgba(162,210,255,0.28);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #5b3a73;
            --on-icy: #17496f;
            --on-pink: #a81b4d;
            --on-sky: #5c5468;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar h1 {
            color: var(--text-heading);
            font-size: 1.6rem;
        }
        .topbar .greeting {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            min-height: 44px;
            min-width: 44px;
            white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger-tint); }
        .btn-large { padding: 14px 28px; font-size: 1.05rem; min-height: 48px; min-width: 48px; }
        .btn-icon { padding: 10px; min-width: 44px; min-height: 44px; }

        /* Section headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 8px;
        }
        .section-header h2 {
            color: var(--accent-light);
            font-size: 1.2rem;
        }

        /* Person cards */
        .person-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
            gap: 12px;
        }
        .person-card:hover { border-color: var(--accent-light); background: var(--surface-thistle); }
        .person-info { flex: 1; min-width: 0; }
        .person-info h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin-bottom: 3px;
        }
        .person-info .meta {
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        .person-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Empty state */
        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 50px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-dashed);
            border-radius: 12px;
        }
        .empty p { margin-bottom: 6px; }

        /* Add bar */
        .add-bar {
            text-align: center;
            margin: 28px 0;
        }

        /* Loading / error */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .error-banner {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--danger-text);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* Modal overlay for add person */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--text-heading);
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--accent-light);
            font-size: 0.85rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 16px;
            min-height: 44px;
            min-width: 44px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-cancel { background: transparent; border: 1px solid var(--cancel-border); color: var(--cancel-text); }
        .btn-cancel:hover { background: var(--cancel-tint); color: var(--text); }

        @media (max-width: 600px) {
            .container { padding: 12px; }
            .person-card { flex-direction: column; align-items: flex-start; }
            .person-actions { width: 100%; justify-content: flex-end; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .topbar-right { width: 100%; justify-content: space-between; }
            .modal { padding: 20px; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top bar -->
        <div class="topbar">
            <div>
                <h1>🔮 МираСкоп</h1>
                <div class="greeting">Здравей, <span id="userEmail">...</span>!</div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-cancel" id="synastryLink" href="#">💞 Съвместимост</a>
                <a class="btn btn-cancel" id="settingsLink" href="#">⚙ Настройки</a>
                <button class="btn btn-danger" onclick="logout()">Изход</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Смяна на тема"></button>
            </div>
        </div>

        <!-- Error banner -->
        <div id="errorBanner" class="error-banner" style="display:none;"></div>

        <!-- Persons list -->
        <div class="section-header">
            <h2>Твоите хора</h2>
        </div>

        <div id="personsList">
            <div class="loading">Зареждане...</div>
        </div>

        <!-- Add button -->
        <div class="add-bar">
            <button class="btn btn-primary btn-large" onclick="openAddModal()">＋ Добави човек</button>
        </div>
    </div>

    <!-- Add Person Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Добави човек</h2>
            <div id="modalError" class="error-banner" style="display:none;"></div>
            <form id="addPersonForm">
                <div class="form-group">
                    <label>Име</label>
                    <input type="text" id="addName" required placeholder="Име на човека">
                </div>
                <div class="row-3">
                    <div class="form-group">
                        <label>Година</label>
                        <input type="number" id="addYear" required placeholder="1988" min="1800" max="2100">
                    </div>
                    <div class="form-group">
                        <label>Месец</label>
                        <input type="number" id="addMonth" required placeholder="1" min="1" max="12">
                    </div>
                    <div class="form-group">
                        <label>Ден</label>
                        <input type="number" id="addDay" required placeholder="8" min="1" max="31">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Час <span class="hint">(по Гринуич)</span></label>
                        <input type="number" id="addHour" value="12" min="0" max="23">
                    </div>
                    <div class="form-group">
                        <label>Минути</label>
                        <input type="number" id="addMinute" value="0" min="0" max="59">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Геогр. ширина</label>
                        <input type="number" id="addLat" step="any" required placeholder="42.6977">
                    </div>
                    <div class="form-group">
                        <label>Геогр. дължина</label>
                        <input type="number" id="addLon" step="any" required placeholder="23.3219">
                    </div>
                </div>
                <div class="form-group">
                    <label>Часова зона</label>
                    <input type="text" id="addTimezone" value="Europe/Sofia" placeholder="Europe/Sofia">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeAddModal()">Отказ</button>
                    <button type="submit" class="btn btn-primary" id="addSubmitBtn">Добави</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function updateThemeToggleIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();

        // --- Auth helpers ---
        function getToken() {
            return localStorage.getItem('miralog_token');
        }

        function authHeaders() {
            const token = getToken();
            if (!token) return {};
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            localStorage.removeItem('miralog_token');
            localStorage.removeItem('miralog_email');
            window.location.replace('/login');
        }

        // Redirect if no token
        if (!getToken()) {
            window.location.replace('/login');
        }

        // Show email
        const email = localStorage.getItem('miralog_email') || '...';
        document.getElementById('userEmail').textContent = email;
        document.getElementById('settingsLink').href = '/settings?token=' + encodeURIComponent(getToken());
        document.getElementById('synastryLink').href = '/synastry?token=' + encodeURIComponent(getToken());

        // --- API helpers ---
        function showError(msg) {
            const el = document.getElementById('errorBanner');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function apiGet(url) {
            const resp = await fetch(url, { headers: authHeaders() });
            if (resp.status === 401) {
                logout();
                return null;
            }
            if (!resp.ok) {
                const data = await resp.json().catch(() => ({}));
                throw new Error(data.detail || 'API грешка');
            }
            return resp.json();
        }

        async function fetchPersons() {
            const listEl = document.getElementById('personsList');
            try {
                const data = await apiGet('/api/persons');
                if (!data) return;

                const persons = data.persons || [];
                if (persons.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty">
                            <p>Все още няма добавени хора.</p>
                            <p>Добавете първия човек, за да видите наталната му карта.</p>
                        </div>`;
                    return;
                }

                let html = '';
                persons.forEach(p => {
                    const hour = String(p.hour).padStart(2, '0');
                    const minute = String(p.minute).padStart(2, '0');
                    html += `
                        <div class="person-card">
                            <div class="person-info">
                                <h3>${escapeHtml(p.name)}</h3>
                                <div class="meta">
                                    ${p.day}.${p.month}.${p.year}, ${hour}:${minute} ч.
                                    • ${p.lat}, ${p.lon}
                                </div>
                            </div>
                            <div class="person-actions">
                                <a href="/chart/${p.id}?token=${encodeURIComponent(getToken())}" class="btn btn-primary">Карта</a>
                                <button class="btn btn-danger btn-icon" onclick="deletePerson(${p.id})" title="Изтрий">✕</button>
                            </div>
                        </div>`;
                });
                listEl.innerHTML = html;
            } catch (err) {
                listEl.innerHTML = `<div class="error-banner">Грешка при зареждане: ${escapeHtml(err.message)}</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deletePerson(id) {
            if (!confirm('Сигурни ли сте, че искате да изтриете този човек?')) return;
            try {
                const resp = await fetch('/api/persons/' + id, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || 'Грешка при изтриване');
                }
                fetchPersons();
            } catch (err) {
                showError(err.message);
            }
        }

        // --- Add person modal ---
        function openAddModal() {
            document.getElementById('addModal').classList.add('open');
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('addPersonForm').reset();
            document.getElementById('addTimezone').value = 'Europe/Sofia';
            document.getElementById('addHour').value = '12';
            document.getElementById('addMinute').value = '0';
            document.getElementById('addName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
        }

        document.getElementById('addPersonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modalError = document.getElementById('modalError');
            const submitBtn = document.getElementById('addSubmitBtn');
            modalError.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Добавяне...';

            const formData = new FormData();
            formData.append('name', document.getElementById('addName').value.trim());
            formData.append('year', document.getElementById('addYear').value);
            formData.append('month', document.getElementById('addMonth').value);
            formData.append('day', document.getElementById('addDay').value);
            formData.append('hour', document.getElementById('addHour').value);
            formData.append('minute', document.getElementById('addMinute').value);
            formData.append('lat', document.getElementById('addLat').value);
            formData.append('lon', document.getElementById('addLon').value);
            formData.append('timezone', document.getElementById('addTimezone').value.trim() || 'Europe/Sofia');

            try {
                const resp = await fetch('/api/persons', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || 'Грешка при добавяне');
                }
                closeAddModal();
                fetchPersons();
            } catch (err) {
                modalError.textContent = err.message;
                modalError.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Добави';
            }
        });

        // Close modal on overlay click
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAddModal();
        });

        // --- Init ---
        fetchPersons();
    </script>
</body>
</html>
