<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моите карти — {{ brand().name }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/favicon-180.png">
    <script>
        (function() {
            var saved = localStorage.getItem('miralog_theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* The mark takes you home — the convention every visitor knows. */
        .logo-home {
            display: inline-flex; flex-shrink: 0; line-height: 0;
            border-radius: 50%; text-decoration: none;
            transition: transform .15s ease, opacity .15s ease;
        }
        .logo-home:hover { transform: scale(1.05); opacity: .9; }
        .logo-home:focus-visible {
            outline: none; box-shadow: var(--focus-ring, 0 0 0 3px rgba(124,58,237,.28));
        }

        /* Any display value beats the hidden attribute, so state it explicitly —
           otherwise a hidden button with display:inline-flex stays on screen. */
        [hidden] { display: none !important; }
        :root {
            --font-body: 'Inter', -apple-system, system-ui, sans-serif;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --shadow-card: 0 0 0 1px rgba(124,58,237,0.06), 0 8px 28px rgba(0,0,0,0.45);
            --shadow-raised: 0 6px 20px rgba(124,58,237,0.32);
            --focus-ring: 0 0 0 3px rgba(124,58,237,0.28);
            --bg: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --border: #2a2a4a;
            --border-dashed: #2a2a4a;
            --text: #e0e0e0;
            --text-heading: #c9b1ff;
            --text-muted: #888;
            --text-dim: #9090a4;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-light: #a78bfa;
            --danger: #ef4444;
            --danger-bg: #2d1b1b;
            --danger-text: #fca5a5;
            --danger-tint: #ef444420;
            --success: #22c55e;
            --overlay: rgba(0,0,0,0.7);
            --cancel-border: #555;
            --cancel-text: #888;
            --cancel-tint: #55555520;
            /* --- pastel palette (raw tones, identical in both themes) --- */
            --thistle: #cdb4db;
            --pastel-petal: #ffc8dd;
            --baby-pink: #ffafcc;
            --icy-blue: #bde0fe;
            --sky-blue: #a2d2ff;
            /* --- pastel accent surfaces (muted for dark backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.10);
            --surface-petal: rgba(255,200,221,0.10);
            --surface-pink: rgba(255,175,204,0.10);
            --surface-icy: rgba(189,224,254,0.10);
            --surface-sky: rgba(162,210,255,0.10);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #c9b1ff;
            --on-icy: #9ecbff;
            --on-pink: #ffafcc;
            --on-sky: #9fb3c8;
        }
        :root[data-theme="light"] {
            --shadow-card: 0 1px 2px rgba(45,36,56,0.04), 0 8px 24px rgba(134,89,163,0.10);
            --shadow-raised: 0 6px 18px rgba(134,89,163,0.28);
            --focus-ring: 0 0 0 3px rgba(134,89,163,0.18);
            --bg: #faf7fb;
            --bg-card: #ffffff;
            --bg-input: #f7f1f9;
            --border: #e5d4ec;
            --border-dashed: #d9c2e6;
            --text: #2d2438;
            --text-heading: #6d4a89;
            --text-muted: #655a78;
            --text-dim: #6b5876;
            --accent: #8659a3;
            --accent-hover: #744a90;
            --accent-light: #764a93;
            --danger: #c2255c;
            --danger-bg: #fff0f5;
            --danger-text: #c2255c;
            --danger-tint: #c2255c1a;
            --success: #16a34a;
            --overlay: rgba(45,36,56,0.5);
            --cancel-border: #d9c7e2;
            --cancel-text: #655a78;
            --cancel-tint: #e5d4ec55;
            /* --- pastel accent surfaces (stronger on light backgrounds) --- */
            --surface-thistle: rgba(205,180,219,0.28);
            --surface-petal: rgba(255,200,221,0.30);
            --surface-pink: rgba(255,175,204,0.28);
            --surface-icy: rgba(189,224,254,0.32);
            --surface-sky: rgba(162,210,255,0.28);
            /* --- readable text on pastel surfaces (WCAG AA verified) --- */
            --on-thistle: #5b3a73;
            --on-icy: #17496f;
            --on-pink: #a81b4d;
            --on-sky: #5c5468;
        }
        body {
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .theme-toggle:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-card); }
        .theme-toggle:active { transform: translateY(0); }
        .theme-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            box-shadow: 0 0 0 4px var(--surface-thistle), var(--shadow-card);
        }
        .topbar h1 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: var(--text-heading);
            font-size: 1.9rem;
        }
        .topbar-left > div { min-width: 0; }
        .topbar .greeting {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-top: 1px;
            /* Дълго име не бива да пробива реда на телефон. */
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* thin rule separating navigation links from the destructive action */
        .topbar-right .nav-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            min-height: 44px;
            min-width: 44px;
            white-space: nowrap;
        }
        .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        /* emoji sits on its own line-box so it optically centres with the label */
        .btn .btn-ico {
            font-size: 1rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger-tint); }
        .btn-large { padding: 14px 28px; font-size: 1.05rem; min-height: 48px; min-width: 48px; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-icon { padding: 10px; min-width: 44px; min-height: 44px; }

        /* Section headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 8px;
        }
        .section-header h2 {
            color: var(--accent-light);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        /* Person cards */
        .person-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
            gap: 12px;
        }
        .person-card:hover { border-color: var(--accent-light); background: var(--surface-thistle); }
        .person-info { flex: 1; min-width: 0; }
        .person-info h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
            margin-bottom: 3px;
        }
        .person-info .meta {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.5;
        }
        .person-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        /* „⋯“: изтриването е рядко и необратимо — не стои до главния бутон. */
        .person-menu { position: relative; }
        .person-menu > .btn { font-size: 1.2rem; letter-spacing: 1px; padding: 6px 10px; }
        .menu-pop {
            position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 150px;
            padding: 4px; border-radius: 10px; background: var(--bg-card);
            border: 1px solid var(--border); box-shadow: var(--shadow-card);
        }
        .menu-item {
            display: block; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;
            border: none; border-radius: 8px; background: none; cursor: pointer;
            font: inherit; font-weight: 500; color: var(--danger);
        }
        .menu-item:hover, .menu-item:focus-visible { background: var(--danger-tint); outline: none; }

        /* „Днес“ води към дневния хороскоп, „Карта“ към цялата карта —
           основният бутон остава един. */
        .person-actions .btn-today { white-space: nowrap; border-color: var(--accent-light); color: var(--accent-light); }
        .person-actions .btn-today:hover { background: var(--surface-thistle); color: var(--accent-light); }

        /* Разчитанията на акаунта — веднъж за всички хора, защото покупките
           са на акаунта, а не на картата. */
        .mod-status { margin: 22px 0 6px; }
        .mod-status + .mod-status { margin-top: 18px; }
        .mod-status .section-header { flex-wrap: wrap; gap: 8px 12px; }
        /* За кого се отварят разчитанията, когато в акаунта има повече хора. */
        .mod-for { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-muted); }
        .mod-for select {
            min-height: 40px; max-width: 200px; padding: 6px 10px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-input); color: var(--text);
            font: inherit; font-size: 16px;
        }
        .mod-for select:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .mod-chips {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
        }
        .mod-chip {
            display: flex; align-items: center; gap: 8px; min-width: 0;
            min-height: 56px; padding: 8px 12px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text); text-decoration: none; font-size: .88rem; font-weight: 500;
            transition: border-color .15s ease, background-color .15s ease;
        }
        .mod-chip:hover { border-color: var(--accent-light); background: var(--surface-thistle); }
        .mod-chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .mod-chip-ico { flex-shrink: 0; width: 18px; text-align: center; color: var(--accent-light); }
        .mod-chip.is-on .mod-chip-ico { color: var(--success); font-weight: 700; }
        /* Цената е под името, не до него: така на телефон името не се реже. */
        .mod-chip-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
        .mod-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mod-chip-price { color: var(--text-muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
        /* Пакетът: рамка в акцентния цвят, пълнеж като на картите — така
           текстът минава контраста и в двете теми. */
        .mod-bundle-card {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 10px; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--accent); background: var(--bg-card);
        }
        .mod-bundle-card strong { display: block; color: var(--text-heading); font-size: 1rem; line-height: 1.35; }
        .mod-bundle-card span { color: var(--text-muted); font-size: .82rem; }
        @media (max-width: 600px) {
            .mod-chips { grid-template-columns: 1fr 1fr; }
            .mod-chip { padding: 8px 10px; gap: 6px; font-size: .84rem; }
            .mod-chip-ico { width: 16px; }
            .mod-bundle-card .btn { width: 100%; justify-content: center; }
        }

        /* Empty state */
        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 50px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-dashed);
            border-radius: 12px;
        }
        .empty p { margin-bottom: 6px; }
        .empty .empty-title { color: var(--text-heading); font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
        .empty .btn { margin-top: 14px; }

        /* Add bar */
        .add-bar {
            text-align: center;
            margin: 28px 0;
        }
        /* „2 от 3 карти“ до бутона — лимитът се вижда, преди формата да е попълнена. */
        .quota { margin-top: 8px; font-size: .85rem; color: var(--text-muted); }
        .quota-note { max-width: 460px; margin: 8px auto 0; font-size: .85rem; line-height: 1.5; color: var(--text-muted); }
        .quota-note a { color: var(--accent-light); }

        /* Loading / error */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .crystal-loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem;
        }
        .crystal-loader .orb-wrap {
            position: relative; width: 56px; height: 56px;
        }
        .crystal-loader .orb {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--accent-light) 35%, var(--accent) 75%, var(--text-heading) 100%);
            box-shadow: 0 0 18px 2px color-mix(in srgb, var(--accent) 55%, transparent);
            animation: orb-pulse 1.8s ease-in-out infinite;
        }
        .crystal-loader .spark {
            position: absolute; inset: 0;
            animation: orb-spin 2.4s linear infinite;
        }
        .crystal-loader .spark::before {
            content: "✦"; position: absolute; top: -6px; left: 50%;
            transform: translateX(-50%); font-size: 0.85rem; color: var(--accent-light);
        }
        @keyframes orb-pulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes orb-spin {
            to { transform: rotate(360deg); }
        }
        .error-banner {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--danger-text);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* Modal overlay for add person */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--text-heading);
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--accent-light);
            font-size: 0.85rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 16px;
            min-height: 44px;
            min-width: 44px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
        .hint-time { margin: -6px 0 12px; }

        .place-group { position: relative; }
        /* В потока, не отгоре: в диалога със скрол absolute списъкът се
           режеше от рамката му. */
        .place-results {
            display: none; position: static;
            margin-top: 6px; max-height: 220px; overflow-y: auto;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; box-shadow: var(--shadow-card);
        }
        .place-results.open { display: block; }
        .place-item {
            padding: 10px 14px; cursor: pointer; font-size: 0.85rem; line-height: 1.45;
            border-bottom: 1px solid var(--border-soft);
            transition: background-color 0.12s ease;
        }
        .place-item:last-child { border-bottom: none; }
        .place-item:hover, .place-item.active { background: var(--surface-thistle); }
        .place-item .pl-name { color: var(--text-heading); font-weight: 600; }
        .place-item .pl-detail { color: var(--text-muted); font-size: 0.78rem; }
        .field-error { margin-top: 6px; font-size: .82rem; line-height: 1.4; color: var(--danger-text); }
        .place-status { padding: 12px 14px; font-size: 0.82rem; color: var(--text-muted); text-align: center; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-cancel { background: transparent; border: 1px solid var(--cancel-border); color: var(--cancel-text); }
        .btn-cancel:hover { background: var(--cancel-tint); color: var(--text); }

        @media (max-width: 600px) {
            .container { padding: 12px; }
            .person-card { flex-direction: column; align-items: flex-start; }
            .person-actions { width: 100%; justify-content: flex-end; }
            .topbar { gap: 12px; margin-bottom: 20px; padding-bottom: 16px; }
            .topbar h1 { font-size: 1.5rem; }
            .brand-logo { width: 40px; height: 40px; }
            /* The actions move to the bottom bar on a phone, so the header
               goes back to being a header: logo, name, greeting. */
            .topbar-right { display: none; }
            .modal { padding: 20px; border-radius: 12px; }

            /* Room for the fixed bar, plus the home-indicator inset. */
            body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
        }

        /* --- bottom navigation (phones only) ---
           Fixed within thumb reach, the way a native app puts its tabs. It is
           hidden by default and only switched on inside the media query above,
           so the desktop layout is untouched. */
        .bottom-nav {
            display: none;
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
            justify-content: space-around; align-items: stretch;
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 16px rgba(0, 0, 0, .18);
        }
        .bottom-nav a, .bottom-nav button {
            flex: 1 1 0; min-width: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px;
            min-height: 56px; padding: 8px 4px;
            border: none; background: none; cursor: pointer;
            font-family: var(--font-body); font-size: .66rem; font-weight: 500;
            /* --text, not --text-muted: at this size the muted tone sat just
               above the AA floor in dark mode. */
            color: var(--text); text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .bn-ico { font-size: 1.2rem; line-height: 1; }
        .bottom-nav a:active, .bottom-nav button:active { background: var(--surface-thistle); }
        .bottom-nav a:focus-visible, .bottom-nav button:focus-visible {
            outline: none; box-shadow: inset 0 0 0 2px var(--accent);
        }
        /* The current page is not a destination — mark it, do not offer it. */
        .bottom-nav .bn-current { color: var(--accent-light); }
        .bottom-nav .bn-danger { color: var(--danger, #ef4444); }
        .bottom-nav [hidden] { display: none !important; }
        /* Switched on last, so it wins over the `display: none` above rather
           than losing to it on source order. */
        @media (max-width: 600px) {
            .bottom-nav { display: flex; }
        }
            .time-unknown-row { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px;
            font-size: .85rem; color: var(--text-muted); cursor: pointer; }
        .time-unknown-row input { min-width: 16px; min-height: 16px; accent-color: var(--accent); }
</style>
    <link rel="stylesheet" href="/static/consent.css">
{% include "_analytics.html" %}
</head>
<body>
    <div class="container">
        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-left">
                <a class="logo-home" href="/" title="Към началната страница" aria-label="Към началната страница"><img class="brand-logo" src="{{ brand().logo }}" alt="{{ brand().name }}"></a>
                <div>
                    <h1>{{ brand().name }}</h1>
                    <div class="greeting" id="greeting">Здравей!</div>
                </div>
            </div>
            <div class="topbar-right">
                <a class="btn btn-cancel" id="moonLink" href="#"><span class="btn-ico" aria-hidden="true">🌙</span>Лунен календар</a>
                <!-- Съвместимостта живее в „Любовен хороскоп“ на самата карта,
                     където има кого да сравняваш. -->
                <a class="btn btn-cancel" id="adminLink" href="#" hidden><span class="btn-ico" aria-hidden="true">⚒</span>Админ</a>
                <a class="btn btn-cancel" id="settingsLink" href="#"><span class="btn-ico" aria-hidden="true">⚙</span>Настройки</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <button class="btn btn-danger" onclick="logout()">Изход</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Светла или тъмна тема" aria-label="Светла или тъмна тема"></button>
            </div>
        </div>

        <!-- Error banner -->
        <div id="errorBanner" class="error-banner" style="display:none;"></div>

        <!-- Persons list -->
        <div class="section-header">
            <h2>Твоите хора</h2>
        </div>

        <div id="personsList">
            <div class="crystal-loader"><div class="orb-wrap"><div class="orb"></div><div class="spark"></div></div>Зареждане на хората…</div>
        </div>

        <!-- Какво вече е твое (безплатното и купеното) и какво още може да се
             прочете. Скрито, докато няма поне един човек: връзките водят към
             негова карта. -->
        <section class="mod-status" id="modOwn" aria-label="Твоите разчитания" hidden>
            <div class="section-header">
                <h2>Твоите разчитания</h2>
                <label class="mod-for" id="modFor" hidden>Отваряй за
                    <select id="modPerson" aria-label="За кого да се отварят разчитанията"></select></label>
            </div>
            <div class="mod-chips" id="ownChips"></div>
        </section>
        <section class="mod-status" id="modMore" aria-label="Още разчитания" hidden>
            <div class="section-header"><h2>Още разчитания</h2></div>
            <div id="modBundle"></div>
            <div class="mod-chips" id="modChips"></div>
        </section>

        <!-- Add button -->
        <div class="add-bar" id="addBar">
            <button class="btn btn-primary btn-large" id="addBtn" onclick="openAddModal()">＋ Добави човек</button>
            <div class="quota" id="quotaInfo" hidden></div>
            <p class="quota-note" id="quotaNote" hidden></p>
        </div>
    </div>

    <!-- Phone navigation. The same destinations as the header, within reach of
         a thumb. Hidden on desktop, where the header already carries them. -->
    <nav class="bottom-nav" aria-label="Основно меню">
        <a href="/dashboard" class="bn-current" aria-current="page">
            <span class="bn-ico" aria-hidden="true">✦</span>Карти</a>
        <a href="#" id="moonLinkMobile">
            <span class="bn-ico" aria-hidden="true">☾</span>Луна</a>
        <a href="#" id="settingsLinkMobile">
            <span class="bn-ico" aria-hidden="true">⚙</span>Настройки</a>
        <a href="#" id="adminLinkMobile" hidden>
            <span class="bn-ico" aria-hidden="true">⚒</span>Админ</a>
        <button type="button" onclick="toggleTheme()" id="themeToggleMobile"
                aria-label="Светла или тъмна тема">
            <span class="bn-ico" aria-hidden="true">◐</span>Тема</button>
        <button type="button" onclick="logout()" class="bn-danger">
            <span class="bn-ico" aria-hidden="true">↪</span>Изход</button>
    </nav>

    <!-- Add Person Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
            <h2 id="addTitle">Добави човек</h2>
            <div id="modalError" class="error-banner" style="display:none;"></div>
            <form id="addPersonForm">
                <div class="form-group">
                    <label for="addName">Име</label>
                    <input type="text" id="addName" required placeholder="Име на човека" autocomplete="off">
                </div>
                <!-- Ден · Месец · Година — като на /start: българинът пише ден първи. -->
                <div class="row-3">
                    <div class="form-group">
                        <label for="addDay">Ден</label>
                        <input type="number" id="addDay" required placeholder="8" min="1" max="31" inputmode="numeric">
                    </div>
                    <div class="form-group">
                        <label for="addMonth">Месец</label>
                        <input type="number" id="addMonth" required placeholder="1" min="1" max="12" inputmode="numeric">
                    </div>
                    <div class="form-group">
                        <label for="addYear">Година</label>
                        <input type="number" id="addYear" required placeholder="1988" min="1800" max="{{ current_year }}" inputmode="numeric">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="addHour">Час</label>
                        <input type="number" id="addHour" value="12" min="0" max="23" inputmode="numeric">
                    </div>
                    <div class="form-group">
                        <label for="addMinute">Минути</label>
                        <input type="number" id="addMinute" value="0" min="0" max="59" inputmode="numeric">
                    </div>
                </div>
                <div class="hint hint-time">Местно време, както е в акта за раждане.</div>
                <label class="time-unknown-row">
                    <input type="checkbox" id="addTimeUnknown"
                           onchange="addHour.disabled = addMinute.disabled = this.checked">
                    <span>Не знам часа на раждане <span class="hint">— без асцендент и домове</span></span>
                </label>
                <div class="form-group place-group">
                    <label for="addPlace">Място на раждане</label>
                    <input type="text" id="addPlace" placeholder="Напр. София, Пловдив, Видин…" autocomplete="off">
                    <div id="placeError" class="field-error" role="alert" hidden></div>
                    <div id="placeResults" class="place-results"></div>
                </div>
                <!-- Попълват се от избраното място; човекът не ги вижда. -->
                <input type="hidden" id="addLat">
                <input type="hidden" id="addLon">
                <input type="hidden" id="addTimezone" value="Europe/Sofia">
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeAddModal()">Отказ</button>
                    <button type="submit" class="btn btn-primary" id="addSubmitBtn">Добави</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/ui.js?v=3"></script>
    <script>
        function crystalLoader(text) {
            return '<div class="crystal-loader"><div class="orb-wrap"><div class="orb"></div><div class="spark"></div></div>' + text + '</div>';
        }

        // Темата е ◐: ☾ е Луната, а долната лента ги бъркаше.
        function updateThemeToggleIcon() {
            document.getElementById('themeToggle').textContent = '◐';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('miralog_theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('miralog_theme', 'light');
            }
            updateThemeToggleIcon();
        }
        updateThemeToggleIcon();

        // --- Auth helpers ---
        function getToken() {
            return localStorage.getItem('miralog_token');
        }

        function authHeaders() {
            const token = getToken();
            if (!token) return {};
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            localStorage.removeItem('miralog_token');
            localStorage.removeItem('miralog_email');
            document.cookie = 'miralog_token=; path=/; Max-Age=0';
            window.location.replace('/login');
        }

        // Redirect if no token
        if (!getToken()) {
            window.location.replace('/login');
        }

        // Поздравът е с името, не с имейла: първо името от Настройки, после
        // първото име на първата карта (обикновено собствената), иначе без име.
        let accountName = '';
        let firstCardName = '';
        function renderGreeting() {
            const name = (accountName || firstCardName.split(/\s+/)[0] || '').trim();
            document.getElementById('greeting').textContent = name ? 'Здравей, ' + name + '!' : 'Здравей!';
        }
        document.getElementById('settingsLink').href = '/settings';
        // synastryLink е премахнат от навигацията.
        document.getElementById('moonLink').href = '/moon';
        // The bottom bar leads to the same places as the header.
        document.getElementById('settingsLinkMobile').href = '/settings';
        document.getElementById('moonLinkMobile').href = '/moon';

        // The admin link only appears for accounts that actually hold the role.
        (async function revealAdminLink() {
            try {
                const resp = await fetch('/api/auth/me', { headers: authHeaders() });
                if (!resp.ok) return;
                const me = await resp.json();
                accountName = (me.display_name || '').trim();
                renderGreeting();
                if (me.is_admin) {
                    // Админ панелът е на отделен поддомейн, а localStorage е per-origin,
                    // затова токенът се подава през ?token= (admin.html го чете от URL).
                    const token = getToken() || '';
                    const adminUrl = 'https://{{ admin_host }}/admin'
                        + (token ? '?token=' + encodeURIComponent(token) : '');
                    ['adminLink', 'adminLinkMobile'].forEach(function (id) {
                        const link = document.getElementById(id);
                        if (!link) return;
                        link.href = adminUrl;
                        link.hidden = false;
                    });
                }
            } catch (e) { /* the panel stays hidden; nothing else depends on this */ }
        })();

        // --- API helpers ---
        function showError(msg) {
            const el = document.getElementById('errorBanner');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function apiGet(url) {
            const resp = await fetch(url, { headers: authHeaders() });
            if (resp.status === 401) {
                logout();
                return null;
            }
            if (!resp.ok) {
                const data = await resp.json().catch(() => ({}));
                throw new Error(detailText(data.detail));
            }
            return resp.json();
        }

        // Последно отворената карта: чиповете с разчитания водят към нея,
        // а не към „първата“ — иначе при няколко души не е ясно за кого са.
        const LAST_KEY = 'miralog_last_person';
        function rememberPerson(id) {
            try { localStorage.setItem(LAST_KEY, String(id)); } catch (e) { /* private mode */ }
        }
        // „Първата“ е най-старата карта: списъкът е по азбучен ред, а първата
        // направена обикновено е на самия човек (тя го поздравява).
        function oldestPerson(persons) {
            return persons.reduce((a, p) => (p.id < a.id ? p : a), persons[0]);
        }
        function targetPerson(persons) {
            let saved = 0;
            try { saved = Number(localStorage.getItem(LAST_KEY)) || 0; } catch (e) {}
            return persons.find(p => p.id === saved) || oldestPerson(persons);
        }

        let allPersons = [];
        let lastQuota = null;
        let moduleData = null;

        function pad2(n) { return String(n).padStart(2, '0'); }

        async function fetchPersons() {
            const listEl = document.getElementById('personsList');
            listEl.innerHTML = crystalLoader('Зареждане на хората…');
            try {
                const data = await apiGet('/api/persons');
                if (!data) return;

                const persons = data.persons || [];
                allPersons = persons;
                lastQuota = data.quota;
                firstCardName = persons.length ? oldestPerson(persons).name || '' : '';
                renderGreeting();
                renderQuota(lastQuota, persons);
                if (persons.length === 0) {
                    document.getElementById('modOwn').hidden = true;
                    document.getElementById('modMore').hidden = true;
                    // Нов акаунт: първият „човек“ е самият той — казваме го така.
                    listEl.innerHTML = `
                        <div class="empty">
                            <p class="empty-title">Въведи рождените си данни и виж безплатната си карта</p>
                            <p>Натална карта и дневен хороскоп са безплатни.</p>
                            <button type="button" class="btn btn-primary btn-large" data-cta="dashboard:create_mine"
                                    onclick="openAddModal(true)">Създай моята карта</button>
                        </div>`;
                    return;
                }

                let html = '';
                persons.forEach(p => {
                    const hour = pad2(p.hour);
                    const minute = pad2(p.minute);
                    // Името на мястото, не координатите; ако няма (стари карти), нищо.
                    const place = p.place ? ' • ' + escapeHtml(p.place) : '';
                    const name = escapeHtml(p.name);
                    html += `
                        <div class="person-card">
                            <div class="person-info">
                                <h3>${name}</h3>
                                <div class="meta">
                                    ${pad2(p.day)}.${pad2(p.month)}.${p.year}, ${p.time_unknown ? 'час неизвестен' : hour + ':' + minute + ' ч.'}${place}
                                </div>
                            </div>
                            <div class="person-actions">
                                <a href="/chart/${p.id}#horoscope" class="btn btn-cancel btn-today"
                                   data-cta="dashboard:today" onclick="rememberPerson(${p.id})"
                                   aria-label="Хороскоп за днес — ${name}">☽ Хороскоп за днес</a>
                                <a href="/chart/${p.id}" class="btn btn-primary" data-cta="dashboard:chart"
                                   onclick="rememberPerson(${p.id})" aria-label="Карта — ${name}">Карта</a>
                                <div class="person-menu">
                                    <button type="button" class="btn btn-cancel btn-icon" aria-haspopup="true"
                                            aria-expanded="false" aria-label="Още за ${name}" title="Още"
                                            onclick="toggleMenu(event, ${p.id})">⋯</button>
                                    <div class="menu-pop" id="menu-${p.id}" hidden>
                                        <button type="button" class="menu-item" onclick="deletePerson(${p.id})">Изтрий</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
                listEl.innerHTML = html;
                loadModuleStatus();
            } catch (err) {
                listEl.innerHTML = `<div class="error-banner">${friendlyErrorHtml(err)}</div>`;
            }
        }

        // „2 от 3 карти“ до бутона; при лимит — неактивен бутон и обяснение,
        // а не отказ чак след попълнена форма.
        function renderQuota(q, persons) {
            const btn = document.getElementById('addBtn');
            const info = document.getElementById('quotaInfo');
            const note = document.getElementById('quotaNote');
            // Празният акаунт има собствен бутон в списъка.
            document.getElementById('addBar').hidden = !persons.length;
            info.hidden = note.hidden = true;
            btn.disabled = false;
            if (!q || !q.limit) return;
            info.textContent = q.used + ' от ' + q.limit + (q.limit === 1 ? ' карта' : ' карти');
            info.hidden = false;
            if (!q.can_add) {
                btn.disabled = true;
                const t = targetPerson(persons);
                const link = q.unlock && t
                    ? ` <a href="/chart/${t.id}?unlock=${encodeURIComponent(q.unlock)}" data-cta="dashboard:unlock_${escapeHtml(q.unlock)}">Отключи</a>`
                    : '';
                note.innerHTML = escapeHtml(q.message || '') + link;
                note.hidden = false;
            }
        }

        // Цена по български: „9 €“, „2,99 €“.
        function money(cents, currency) {
            const v = ((Number(cents) || 0) / 100).toFixed(2).replace('.', ',').replace(',00', '');
            return v + ' ' + ((currency || 'EUR') === 'EUR' ? '€' : currency);
        }

        // Кратки имена (същите като в картата): пълните не се събират в плочка на телефон.
        const MOD_SHORT = {
            profile: 'Профил', period: 'Период', love: 'Любов',
            akashic: 'Акашови записи', numerology: 'Нумерология', moon: 'Лунен календар',
        };
        // Каталогът дава за Луната ◐ — същото като бутона за тема; тук е ☾.
        const MOD_GLYPH = { moon: '☾' };
        // Безплатното в акаунта: показва се като твое, не като нещо за купуване.
        const FREE_OWN = ['chart', 'horoscope'];

        /* Две групи: „Твоите разчитания“ — безплатните и купените, с отметка,
           и „Още разчитания“ — заключените с цена (пакетът — само ако остават
           поне две, сървърът връща bundle само тогава). Покупките са на
           акаунта, а картата е мястото, откъдето се отварят: при няколко
           души се избира за коя. Грешка тук не бива да чупи таблото. */
        async function loadModuleStatus() {
            try {
                // peek: таблото само гледа и не взима запомнения при регистрация избор.
                moduleData = await apiGet('/api/features?peek=1');
                renderModules();
            } catch (e) {
                document.getElementById('modOwn').hidden = true;
                document.getElementById('modMore').hidden = true;
            }
        }

        function renderModules() {
            const data = moduleData;
            const own = document.getElementById('modOwn');
            const more = document.getElementById('modMore');
            if (!data || !allPersons.length) { own.hidden = more.hidden = true; return; }

            const multi = allPersons.length > 1;
            const target = targetPerson(allPersons);
            const base = '/chart/' + target.id;
            const forName = multi ? ' — за ' + escapeHtml(target.name) : '';

            // „Отваряй за“ има смисъл само при повече от един човек.
            const forBox = document.getElementById('modFor');
            forBox.hidden = !multi;
            if (multi) {
                document.getElementById('modPerson').innerHTML = allPersons.map(p =>
                    `<option value="${p.id}"${p.id === target.id ? ' selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
            }

            const catalogue = data.catalogue || [];
            const ownItems = catalogue.filter(i => FREE_OWN.includes(i.key) || (!i.included && i.unlocked));
            const lockedItems = catalogue.filter(i => !i.included && !i.unlocked && i.offer);

            document.getElementById('ownChips').innerHTML = ownItems.map(i => {
                const name = escapeHtml(MOD_SHORT[i.key] || i.name);
                const key = escapeHtml(i.key);
                const free = FREE_OWN.includes(i.key);
                const href = i.key === 'moon' ? '/moon'
                    : i.key === 'chart' ? base : base + '#' + encodeURIComponent(i.key);
                const aria = name + (free ? ' — безплатно' : ' — отключено') + (i.key === 'moon' ? '' : forName);
                return `<a class="mod-chip is-on" href="${href}" data-cta="dashboard:open_${key}"
                           onclick="rememberPerson(${target.id})" aria-label="${aria}">
                    <span class="mod-chip-ico" aria-hidden="true">✓</span>
                    <span class="mod-chip-text"><span class="mod-chip-name">${name}</span>
                        ${free ? '<span class="mod-chip-price">безплатно</span>' : ''}</span></a>`;
            }).join('');
            own.hidden = !ownItems.length;

            document.getElementById('modChips').innerHTML = lockedItems.map(i => {
                const name = escapeHtml(MOD_SHORT[i.key] || i.name);
                const key = escapeHtml(i.key);
                const price = money(i.offer.price_cents, i.offer.currency);
                return `<a class="mod-chip" href="${base}?unlock=${encodeURIComponent(i.key)}"
                           data-cta="dashboard:unlock_${key}"
                           aria-label="${name} — заключено, ${price}. Отключи${forName}">
                    <span class="mod-chip-ico" aria-hidden="true">${escapeHtml(MOD_GLYPH[i.key] || i.glyph || '✦')}</span>
                    <span class="mod-chip-text"><span class="mod-chip-name">${name}</span>
                        <span class="mod-chip-price">${price}</span></span></a>`;
            }).join('');

            const b = data.bundle;
            const bundleBox = document.getElementById('modBundle');
            if (b && lockedItems.length >= 2) {
                // „Всички“ само ако наистина са всички; иначе „останалите“.
                const paidOwned = ownItems.filter(i => !FREE_OWN.includes(i.key)).length;
                const all = b.keys.length >= lockedItems.length + paidOwned;
                bundleBox.innerHTML = `
                    <div class="mod-bundle-card">
                        <div>
                            <strong>${all ? 'Всички' : 'Останалите'} ${b.keys.length} разчитания — ${money(b.price_cents, b.currency)}
                                вместо ${money(b.full_price_cents, b.currency)}</strong>
                            <span>Плащаш веднъж, остават ти завинаги.</span>
                        </div>
                        <a class="btn btn-primary" href="${base}?unlock=bundle" onclick="rememberPerson(${target.id})"
                           data-cta="dashboard:bundle">Вземи всички</a>
                    </div>`;
            } else {
                bundleBox.innerHTML = '';
            }
            more.hidden = !lockedItems.length;
        }

        document.getElementById('modPerson').addEventListener('change', function () {
            rememberPerson(this.value);
            renderModules();
            // Връзката „Отключи“ при лимит също сочи към избраната карта.
            renderQuota(lastQuota, allPersons);
        });

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // --- Меню „⋯“ на картата ---
        function closeMenus() {
            document.querySelectorAll('.menu-pop').forEach(m => { m.hidden = true; });
            document.querySelectorAll('.person-menu > .btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
        }
        function toggleMenu(ev, id) {
            ev.stopPropagation();
            const pop = document.getElementById('menu-' + id);
            const wasOpen = !pop.hidden;
            closeMenus();
            if (!wasOpen) {
                pop.hidden = false;
                ev.currentTarget.setAttribute('aria-expanded', 'true');
            }
        }
        document.addEventListener('click', closeMenus);

        async function deletePerson(id) {
            closeMenus();
            const ok = await uiConfirm('Картата и всички разчитания към нея се изтриват безвъзвратно.', {
                title: 'Да изтрия ли този човек?', ok: 'Изтрий', danger: true });
            if (!ok) return;
            try {
                const resp = await fetch('/api/persons/' + id, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(detailText(data.detail));
                }
                fetchPersons();
            } catch (err) {
                showError(friendlyError(err));
            }
        }

        // --- Place search (geocoding) ---
        let placeTimer = null;
        let placeSeq = 0;

        function closePlaceResults() {
            const box = document.getElementById('placeResults');
            box.classList.remove('open');
            box.innerHTML = '';
        }

        function showPlaceError(msg) {
            const el = document.getElementById('placeError');
            el.textContent = msg || '';
            el.hidden = !msg;
        }

        function pickPlace(lat, lon, tz, label) {
            clearTimeout(placeTimer);
            placeSeq++;
            document.getElementById('addLat').value = lat;
            document.getElementById('addLon').value = lon;
            if (tz) document.getElementById('addTimezone').value = tz;
            document.getElementById('addPlace').value = label;
            showPlaceError('');
            closePlaceResults();
        }

        async function searchPlace(query) {
            const seq = ++placeSeq;
            const box = document.getElementById('placeResults');
            box.innerHTML = '<div class="place-status">Търсене…</div>';
            box.classList.add('open');
            try {
                const resp = await fetch('/api/geocode?q=' + encodeURIComponent(query), { headers: authHeaders() });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) throw await apiError(resp);
                const data = await resp.json();
                if (seq !== placeSeq) return;   // междувременно е избрано или променено
                const results = data.results || [];
                if (!results.length) {
                    box.innerHTML = '<div class="place-status">Няма намерени места.</div>';
                    return;
                }
                box.innerHTML = results.map((r, idx) => {
                    const name = escapeHtml(r.place || r.label);
                    const detail = escapeHtml(r.label);
                    return `<div class="place-item" role="button" tabindex="0" data-idx="${idx}">
                        <div class="pl-name">${name}</div>
                        <div class="pl-detail">${detail}</div>
                    </div>`;
                }).join('');
                box.querySelectorAll('.place-item').forEach(el => {
                    const r = results[Number(el.dataset.idx)];
                    const choose = () => pickPlace(r.lat, r.lon, r.timezone || '', r.place || r.label);
                    el.addEventListener('click', choose);
                    el.addEventListener('keydown', e => { if (e.key === 'Enter') choose(); });
                });
                // Списъкът е в потока на диалога; ако е под екрана — доближи го.
                box.scrollIntoView({ block: 'nearest' });
            } catch (e) {
                if (seq !== placeSeq) return;
                box.innerHTML = '<div class="place-status">' + friendlyErrorHtml(e) + '</div>';
            }
        }

        // Написано, но неизбрано от списъка място: търсим първия резултат
        // (както на /start) вместо да искаме координати.
        async function ensurePlace() {
            if (document.getElementById('addLat').value && document.getElementById('addLon').value) return true;
            const typed = document.getElementById('addPlace').value.trim();
            if (!typed) { showPlaceError('Въведи място на раждане.'); return false; }
            // Търсенето от въвеждането вече не е нужно — това го замества.
            clearTimeout(placeTimer);
            placeSeq++;
            try {
                const resp = await fetch('/api/geocode?q=' + encodeURIComponent(typed), { headers: authHeaders() });
                if (resp.status === 401) { logout(); return false; }
                const data = resp.ok ? await resp.json() : { results: [] };
                const r = (data.results || [])[0];
                if (r) {
                    pickPlace(r.lat, r.lon, r.timezone || '', r.place || r.label);
                    return true;
                }
            } catch (e) { /* показваме съобщението по-долу */ }
            closePlaceResults();
            showPlaceError('Не намерихме такова място. Избери от списъка или опитай с по-голям град наблизо.');
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('addPlace');
            if (!input) return;
            input.addEventListener('input', () => {
                // Променено място — старите координати вече не важат.
                document.getElementById('addLat').value = '';
                document.getElementById('addLon').value = '';
                showPlaceError('');
                const q = input.value.trim();
                clearTimeout(placeTimer);
                if (q.length < 2) { placeSeq++; closePlaceResults(); return; }
                // Debounced so we stay within Nominatim's one-request-per-second policy.
                placeTimer = setTimeout(() => searchPlace(q), 600);
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.place-group')) closePlaceResults();
            });
        });

        // --- Add person modal ---
        function openAddModal(mine) {
            const modal = document.getElementById('addModal');
            document.getElementById('addPersonForm').reset();
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('addTimezone').value = 'Europe/Sofia';
            document.getElementById('addLat').value = '';
            document.getElementById('addLon').value = '';
            document.getElementById('addHour').value = '12';
            document.getElementById('addMinute').value = '0';
            document.getElementById('addHour').disabled = document.getElementById('addMinute').disabled = false;
            showPlaceError('');
            clearTimeout(placeTimer);
            placeSeq++;
            closePlaceResults();
            // Първата карта на нов акаунт е на самия човек.
            document.getElementById('addTitle').textContent = mine ? 'Създай моята карта' : 'Добави човек';
            document.getElementById('addSubmitBtn').textContent = mine ? 'Създай картата' : 'Добави';
            document.getElementById('addName').placeholder = mine ? 'Как се казваш' : 'Име на човека';
            if (mine && accountName) document.getElementById('addName').value = accountName;
            modal.dataset.mine = mine ? '1' : '';
            modal.classList.add('open');
            document.getElementById('addName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
        }

        document.getElementById('addPersonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modalError = document.getElementById('modalError');
            const submitBtn = document.getElementById('addSubmitBtn');
            const idleText = document.getElementById('addModal').dataset.mine ? 'Създай картата' : 'Добави';
            modalError.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Търсим мястото…';
            if (!(await ensurePlace())) {
                submitBtn.disabled = false;
                submitBtn.textContent = idleText;
                document.getElementById('placeError').scrollIntoView({ block: 'nearest' });
                return;
            }
            submitBtn.textContent = 'Добавяне…';

            const formData = new FormData();
            formData.append('name', document.getElementById('addName').value.trim());
            formData.append('year', document.getElementById('addYear').value);
            formData.append('month', document.getElementById('addMonth').value);
            formData.append('day', document.getElementById('addDay').value);
            formData.append('hour', document.getElementById('addHour').value);
            formData.append('minute', document.getElementById('addMinute').value);
            formData.append('time_unknown', document.getElementById('addTimeUnknown').checked ? 'true' : 'false');
            formData.append('lat', document.getElementById('addLat').value);
            formData.append('lon', document.getElementById('addLon').value);
            formData.append('timezone', document.getElementById('addTimezone').value.trim() || 'Europe/Sofia');
            // Името на мястото (по избор) — за таблото вместо координати.
            formData.append('place', document.getElementById('addPlace').value.trim());

            try {
                const resp = await fetch('/api/persons', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                if (resp.status === 401) { logout(); return; }
                if (!resp.ok) throw await apiError(resp);
                closeAddModal();
                fetchPersons();
            } catch (err) {
                modalError.textContent = friendlyError(err);
                modalError.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = idleText;
            }
        });

        // Close modal on overlay click
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeAddModal(); closeMenus(); }
        });

        // --- Init ---
        fetchPersons().then(offerGuestChart);

        /* Карта, направена на /start преди вход (напр. „имейлът е зает →
           вход“): досега се губеше и трябваше да се въвежда наново. */
        async function offerGuestChart() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('miralog_guest_birth') || 'null'); } catch (e) {}
            if (!saved || !saved.birth || Date.now() - (saved.at || 0) > 7 * 864e5) return;
            const b = saved.birth;
            const when = b.day + '.' + b.month + '.' + b.year;
            const ok = await uiConfirm('Имаш карта от преди малко — ' + (b.name || 'без име') + ', ' + when
                + (saved.label ? ', ' + saved.label : '') + '. Да я запазим в акаунта ти?',
                { title: 'Запази картата', ok: 'Запази', cancel: 'Не, благодаря' });
            try { localStorage.removeItem('miralog_guest_birth'); } catch (e) {}
            if (!ok) return;
            const fd = new FormData();
            ['name', 'year', 'month', 'day', 'hour', 'minute', 'lat', 'lon', 'timezone', 'time_unknown'].forEach(function (k) {
                if (b[k] != null) fd.append(k, b[k]);
            });
            // Мястото е запазено отделно от данните за раждането (saved.label).
            const placeName = b.place || String(saved.label || '').split(',')[0].trim();
            if (placeName) fd.append('place', placeName);
            const resp = await fetch('/api/persons', { method: 'POST', headers: authHeaders(), body: fd });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                const d = data.detail;
                uiAlert(typeof d === 'string' ? d : (d && d.message) || 'Картата не се запази.', { title: 'Не се получи' });
                return;
            }
            fetchPersons();
        }
    </script>
    <script src="/static/consent.js?v=6"></script>
</body>
