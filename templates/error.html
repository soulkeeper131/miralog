<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ title }} — {{ brand().name }}</title>
    <meta name="robots" content="noindex">
    {% include "_critical.html" %}
    <link rel="stylesheet" href="/static/landing.min.css?v=8">
    <style>
        .err-page { max-width: 34rem; margin: 0 auto; padding: 14vh 16px 10vh; text-align: center; }
        .err-page .err-glyph { font-size: 3rem; opacity: .7; }
        .err-page h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: .4em 0; }
        .err-page p { line-height: 1.6; opacity: .85; }
        .err-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    </style>
</head>
<body>
    {% include "_site_nav.html" %}
    <main class="err-page">
        <div class="err-glyph" aria-hidden="true">☽</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="err-actions">
            <a class="btn btn-primary" href="/">Към началото</a>
            <a class="btn btn-ghost" href="/horoskop">Дневен хороскоп</a>
        </div>
    </main>
</body>
</html>
